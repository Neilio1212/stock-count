<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#1a56db">
<title>Stock Count</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap');
:root {
  --bg:#f5f7fa; --surface:#fff; --surface2:#f0f2f6; --border:#e2e6ed;
  --blue:#1a56db; --blue-lt:#ebf0fd;
  --green:#0e9f6e; --green-lt:#e8f9f4;
  --red:#e02424; --red-lt:#fdf2f2;
  --amber:#d97706; --amber-lt:#fffbeb;
  --muted:#6b7280; --text:#111827; --text2:#374151;
  --mono:'DM Mono','Courier New',monospace;
  --sans:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;color-scheme:light}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;-webkit-text-size-adjust:100%;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.scroll-area{-webkit-flex:1;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:constant(safe-area-inset-bottom,12px);padding-bottom:env(safe-area-inset-bottom,12px)}
.sticky-bar{position:-webkit-sticky;position:sticky;top:0;z-index:100;background:var(--surface);box-shadow:0 1px 0 var(--border),0 2px 8px rgba(0,0,0,.06)}

/* Header */
.header{background:var(--blue);padding:14px 16px 12px}
.header h1{font-size:17px;font-weight:700;color:#fff;margin-bottom:10px}
.header h1 span{display:block;font-size:11px;font-weight:500;opacity:.75;margin-top:1px}
.header-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field-group label{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.65);display:block;margin-bottom:3px}
.field-group input{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;padding:7px 8px;border-radius:6px;width:100%;font-size:16px;font-family:var(--sans);-webkit-appearance:none;appearance:none}
.field-group input::placeholder{color:rgba(255,255,255,.45)}
.field-group input:focus{outline:none;background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.6)}

/* Action bar */
.autosave{font-size:10px;color:var(--muted);padding:5px 16px;background:var(--surface2);border-bottom:1px solid var(--border);font-family:var(--mono)}
.footer{padding:8px 12px;display:-webkit-flex;display:flex;gap:6px;background:var(--surface);border-bottom:1px solid var(--border);-webkit-flex-wrap:wrap;flex-wrap:wrap}
.btn{border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:10px 12px;cursor:pointer;font-family:var(--sans);-webkit-appearance:none;appearance:none;touch-action:manipulation;border:none}
.btn-save{background:var(--surface2);border:1px solid var(--border);color:var(--text2)}
.btn-reset{background:#fff;border:1px solid var(--red);color:var(--red)}
.btn-excel{background:#fff;border:1px solid var(--green);color:var(--green);-webkit-flex:1;flex:1}
.btn-email{background:var(--blue);color:#fff;-webkit-flex:1;flex:1}
.btn-save:active{background:var(--border)}
.btn-reset:active{background:var(--red-lt)}
.btn-excel:active{background:var(--green-lt)}
.btn-email:active{opacity:.85}

/* Location */
.section-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:10px 16px 5px}
.locations-wrap{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;background:var(--surface);border-bottom:1px solid var(--border)}
.locations{display:-webkit-flex;display:flex;flex-wrap:nowrap;gap:6px;padding:8px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-webkit-flex:1;flex:1;scroll-behavior:smooth}
.locations::-webkit-scrollbar{display:none}
.loc-arrow{background:var(--surface);border:none;border-left:1px solid var(--border);border-right:1px solid var(--border);color:var(--blue);font-size:16px;padding:0 10px;cursor:pointer;-webkit-flex-shrink:0;flex-shrink:0;touch-action:manipulation;-webkit-appearance:none;appearance:none;min-height:44px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.loc-arrow:active{background:var(--blue-lt)}
.loc-arrow.left{border-left:none}
.loc-arrow.right{border-right:none}
.loc-btn{background:var(--surface);border:1.5px solid var(--border);color:var(--text2);padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--sans);touch-action:manipulation;-webkit-appearance:none;appearance:none;white-space:nowrap;-webkit-flex-shrink:0;flex-shrink:0}
.loc-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}

/* Cat tabs */
.cat-tabs{display:-webkit-flex;display:flex;background:var(--surface);border-bottom:1px solid var(--border)}
.cat-tab{-webkit-flex:1;flex:1;padding:11px 4px;font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;text-align:center;border:none;background:transparent;color:var(--muted);font-family:var(--sans);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}
.cat-tab.active{color:var(--blue);border-bottom-color:var(--blue);background:var(--blue-lt)}
.cat-tab.unexp.active{color:var(--amber);border-bottom-color:var(--amber);background:var(--amber-lt)}

/* Family carousel */
.families-wrap{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;background:var(--surface2);border-bottom:1px solid var(--border)}
.families{display:-webkit-flex;display:flex;flex-wrap:nowrap;gap:6px;padding:7px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-webkit-flex:1;flex:1;scroll-behavior:smooth}
.families::-webkit-scrollbar{display:none}
.fam-arrow{background:var(--surface2);border:none;border-left:1px solid var(--border);border-right:1px solid var(--border);color:var(--blue);font-size:16px;padding:0 10px;cursor:pointer;-webkit-flex-shrink:0;flex-shrink:0;touch-action:manipulation;-webkit-appearance:none;appearance:none;min-height:44px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.fam-arrow:active{background:var(--blue-lt)}
.fam-arrow.left{border-right:1px solid var(--border);border-left:none}
.fam-arrow.right{border-left:1px solid var(--border);border-right:none}
.family-btn{background:var(--surface);border:1.5px solid var(--border);color:var(--text2);padding:6px 14px;border-radius:6px;font-size:12px;font-weight:700;white-space:nowrap;-webkit-flex-shrink:0;flex-shrink:0;cursor:pointer;font-family:var(--sans);touch-action:manipulation;-webkit-appearance:none;appearance:none}
.family-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.family-btn.unassigned{border-style:dashed;color:var(--muted);background:var(--surface2)}

/* Pills */
.pills-wrap{display:-webkit-flex;display:flex;align-items:center;background:var(--surface);border-bottom:1px solid var(--border);position:relative}
.pills-arrow{background:var(--surface);border:none;border-left:1px solid var(--border);border-right:1px solid var(--border);color:var(--blue);font-size:16px;padding:0 10px;height:100%;cursor:pointer;-webkit-flex-shrink:0;flex-shrink:0;touch-action:manipulation;-webkit-appearance:none;appearance:none;min-height:44px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.pills-arrow:active{background:var(--blue-lt)}
.pills-arrow.left{border-right:1px solid var(--border);border-left:none}
.pills-arrow.right{border-left:1px solid var(--border);border-right:none}
.pills{display:-webkit-flex;display:flex;flex-wrap:nowrap;gap:6px;padding:7px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-webkit-flex:1;flex:1;scroll-behavior:smooth}
.pills::-webkit-scrollbar{display:none}
.pill{background:var(--surface2);border:1.5px solid var(--border);color:var(--text2);padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--sans);display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:5px;touch-action:manipulation;-webkit-appearance:none;appearance:none;white-space:nowrap;-webkit-flex-shrink:0;flex-shrink:0}
.pill.active{background:var(--blue-lt);border-color:var(--blue);color:var(--blue)}
.pill-badge{background:var(--border);color:var(--muted);border-radius:10px;padding:1px 6px;font-size:10px;font-family:var(--mono)}
.pill.active .pill-badge{background:var(--blue);color:#fff}
.pill.unassigned { background: var(--surface2); border: 1.5px dashed #cbd5e0; color: var(--muted); }
.pill.unassigned .pill-badge { background: #e2e6ed; color: var(--muted); }

/* Progress */
.progress-wrap{background:var(--surface);padding:8px 16px 10px;border-bottom:1px solid var(--border)}
.progress-bar{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--green),#34d399);-webkit-transition:width .4s ease;transition:width .4s ease;border-radius:99px}
.progress-text{font-size:13px;font-weight:700;color:var(--green);margin-top:5px;text-align:center}

/* Items */
.items-list{padding:8px 10px;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;gap:5px}
.item-row{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:10px;-webkit-transition:border-color .15s,background .15s;transition:border-color .15s,background .15s}
.item-row.match{background:var(--green-lt);border-color:#6ee7b7}
.item-row.over{background:var(--amber-lt);border-color:#fcd34d}
.item-row.under{background:var(--red-lt);border-color:#fca5a5}
.item-row.counted{background:var(--blue-lt);border-color:#93c5fd}
.item-row.flash{-webkit-animation:flashmatch .5s ease;animation:flashmatch .5s ease}
@-webkit-keyframes flashmatch{0%{background:var(--surface)}35%{background:#d1fae5;border-color:var(--green);-webkit-transform:scale(1.01);transform:scale(1.01)}100%{background:var(--blue-lt);border-color:#93c5fd;-webkit-transform:scale(1);transform:scale(1)}}
@keyframes flashmatch{0%{background:var(--surface)}35%{background:#d1fae5;border-color:var(--green);transform:scale(1.01)}100%{background:var(--blue-lt);border-color:#93c5fd;transform:scale(1)}}
.item-info{-webkit-flex:1;flex:1;min-width:0}
.item-ref{font-size:12px;font-weight:600;color:var(--blue);letter-spacing:.5px;font-family:var(--mono)}
.item-row.match .item-ref{color:var(--green)}
.item-row.over  .item-ref{color:var(--amber)}
.item-row.under .item-ref{color:var(--red)}
.item-name{font-size:11px;color:var(--muted);margin-top:2px;white-space:normal;word-break:break-word;line-height:1.4}
.exp-block{background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;padding:4px 8px;min-width:46px;text-align:center;-webkit-flex-shrink:0;flex-shrink:0}
.exp-block.assigned{background:var(--blue-lt);border-color:#93c5fd}
.exp-block.assigned .exp-lbl{color:var(--blue)}
.exp-block.assigned .exp-val{color:var(--blue)}
.item-row.match .exp-block{background:var(--green-lt)!important;border-color:#6ee7b7!important}
.item-row.match .exp-val{color:var(--green)!important}
.item-row.over  .exp-block{background:var(--amber-lt)!important;border-color:#fcd34d!important}
.item-row.over  .exp-val{color:var(--amber)!important}
.item-row.under .exp-block{background:var(--red-lt)!important;border-color:#fca5a5!important}
.item-row.under .exp-val{color:var(--red)!important}
.item-row.match .exp-block{background:var(--green-lt);border-color:#6ee7b7}
.item-row.over  .exp-block{background:var(--amber-lt);border-color:#fcd34d}
.item-row.under .exp-block{background:var(--red-lt);border-color:#fca5a5}
.exp-lbl{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.exp-val{font-size:17px;font-weight:700;color:var(--text);font-family:var(--mono);line-height:1.2}
.item-row.match .exp-val{color:var(--green)}
.item-row.over  .exp-val{color:var(--amber)}
.item-row.under .exp-val{color:var(--red)}
.qty-controls{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:4px;-webkit-flex-shrink:0;flex-shrink:0}
.qty-btn{width:44px;height:44px;background:var(--surface2);border:1.5px solid var(--border);color:var(--text2);border-radius:8px;font-size:22px;cursor:pointer;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;font-family:var(--mono);font-weight:700;touch-action:manipulation;-webkit-appearance:none;appearance:none;-webkit-user-select:none;user-select:none}
.qty-btn:active{background:var(--blue-lt);border-color:var(--blue);color:var(--blue)}
.qty-field{width:54px;height:44px;background:#fff;color:var(--text);border:1.5px solid var(--border);border-radius:8px;text-align:center;font-size:17px;font-weight:700;font-family:var(--mono);-webkit-appearance:none;appearance:none}
.qty-field:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.12)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:32px}

/* Unexpected */
.unexp-form{margin:8px 10px;background:var(--surface);border:1.5px solid var(--amber);border-radius:8px;padding:12px;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;gap:8px}
.unexp-form-title{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--amber)}
.unexp-form input{background:var(--surface2);border:1.5px solid var(--border);color:var(--text);padding:9px 10px;border-radius:6px;font-size:16px;font-family:var(--sans);width:100%;-webkit-appearance:none;appearance:none}
.unexp-form input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(217,119,6,.12)}
.unexp-form input::placeholder{color:var(--muted)}
.btn-add-item{background:var(--amber);border:none;color:#fff;padding:11px;border-radius:6px;font-size:13px;font-weight:700;font-family:var(--sans);cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none;-webkit-flex:1;flex:1}
.btn-add-item:active{opacity:.85}
.unexp-list{padding:0 10px 8px;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;gap:5px}
.unexp-row{background:var(--surface);border:1.5px solid var(--border);border-left:3px solid var(--amber);border-radius:8px;padding:10px 12px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:10px}
.unexp-ref{font-size:12px;font-weight:600;color:var(--amber);font-family:var(--mono)}
.unexp-name{font-size:11px;color:var(--muted);margin-top:2px}
.unexp-qty-block{background:var(--amber-lt);border:1.5px solid #fcd34d;border-radius:8px;padding:4px 10px;text-align:center;min-width:46px;-webkit-flex-shrink:0;flex-shrink:0}
.unexp-qty-lbl{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--amber)}
.unexp-qty-val{font-size:17px;font-weight:700;color:var(--amber);font-family:var(--mono);line-height:1.2}
.unexp-del{background:transparent;border:none;color:var(--red);font-size:22px;padding:4px 6px;cursor:pointer;touch-action:manipulation;-webkit-flex-shrink:0;flex-shrink:0}
.unexp-empty{text-align:center;color:var(--muted);padding:24px 16px;font-size:13px}

/* ── Hospital warning modal ── */
.modal-overlay{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,0.55);z-index:500;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;padding:24px}
.modal-overlay.hidden{display:none}
.modal{background:var(--surface);border-radius:12px;padding:24px;max-width:320px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.modal-icon{font-size:32px;text-align:center;margin-bottom:12px}
.modal-title{font-size:16px;font-weight:700;color:var(--text);text-align:center;margin-bottom:8px;line-height:1.3}
.modal-body{font-size:13px;color:var(--muted);text-align:center;line-height:1.5;margin-bottom:20px}
.modal-body strong{color:var(--red);font-weight:700}
.modal-btns{display:-webkit-flex;display:flex;gap:10px}
.modal-btn-no{-webkit-flex:1;flex:1;background:var(--surface2);border:1.5px solid var(--border);color:var(--text2);padding:12px;border-radius:8px;font-size:13px;font-weight:700;font-family:var(--sans);cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}
.modal-btn-yes{-webkit-flex:1;flex:1;background:var(--red);border:none;color:#fff;padding:12px;border-radius:8px;font-size:13px;font-weight:700;font-family:var(--sans);cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}
.modal-btn-no:active{background:var(--border)}
.modal-btn-yes:active{opacity:.85}

/* Toast & FAB */
.toast{position:fixed;bottom:80px;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;opacity:0;-webkit-transition:opacity .25s;transition:opacity .25s;pointer-events:none;z-index:999;text-align:center;width:88vw;max-width:340px;line-height:1.6;font-weight:600;white-space:pre-line}
.toast.show{opacity:1}
.no-results{text-align:center;color:var(--muted);padding:32px;font-size:13px}
canvas{display:none}
.fab-top{position:fixed;bottom:24px;left:16px;width:50px;height:50px;background:var(--blue);border:none;border-radius:50%;color:#fff;font-size:22px;font-weight:900;cursor:pointer;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;box-shadow:0 4px 16px rgba(26,86,219,.35);touch-action:manipulation;-webkit-appearance:none;appearance:none;z-index:200;opacity:0;pointer-events:none;-webkit-transition:opacity .2s;transition:opacity .2s}
.fab-top.visible{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<div class="scroll-area">
  <div class="header">
    <h1>Stock Count <span>MIS Consumables &amp; Instruments</span></h1>
    <div class="header-fields">
      <div class="field-group"><label>Name</label><input type="text" id="inp-name" placeholder="Your name"></div>
      <div class="field-group"><label>Date</label><input type="date" id="inp-date"></div>
    </div>
  </div>
  <div class="autosave" id="autosave-label">Not yet saved</div>
  <div class="footer">
    <button class="btn btn-save"  onclick="saveProgress()">Save</button>
    <button class="btn btn-reset" onclick="resetCounts()">Reset</button>
    <button class="btn btn-excel" onclick="downloadExcel()">Export to Excel</button>
  </div>
  <div class="locations-wrap">
    <button class="loc-arrow left" onclick="scrollCarousel('locations',-1)">&#8249;</button>
    <div class="locations" id="locations"></div>
    <button class="loc-arrow right" onclick="scrollCarousel('locations',1)">&#8250;</button>
  </div>
  <div class="sticky-bar">
    <div class="cat-tabs" id="cat-tabs"></div>
    <div class="families-wrap">
      <button class="fam-arrow left" onclick="scrollCarousel('families',-1)">&#8249;</button>
      <div class="families" id="families"></div>
      <button class="fam-arrow right" onclick="scrollCarousel('families',1)">&#8250;</button>
    </div>
    <div class="pills-wrap">
      <button class="pills-arrow left" onclick="scrollCarousel('pills',-1)">&#8249;</button>
      <div class="pills" id="pills"></div>
      <button class="pills-arrow right" onclick="scrollCarousel('pills',1)">&#8250;</button>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-text" id="progress-text">0 of 0 counts entered</div>
    </div>
  </div>
  <div class="items-list" id="items-list"></div>
</div>
<div class="toast" id="toast"></div>
<button class="fab-top" id="fab-top" onclick="scrollToTop()">&#8679;</button>

<!-- Hospital switch warning modal -->
<div class="modal-overlay hidden" id="hosp-modal" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-icon">&#9888;&#65039;</div>
    <div class="modal-title" id="modal-title">Switch hospital?</div>
    <div class="modal-body" id="modal-body">This hospital is currently being counted.</div>
    <div class="modal-btns">
      <button class="modal-btn-no" onclick="dismissModal()">No — Stay</button>
      <button class="modal-btn-yes" onclick="confirmSwitch()">Yes — Reset &amp; Switch</button>
    </div>
  </div>
</div>
<script>

const HOSPITALS = ["Alfred", "Ballarat Day", "Barwon", "Box Hill", "Cabrini Brig", "Epworth East", "Epworth Geel", "Epworth Rich", "SJOG Bendigo", "SJOG Geelong", "Sandringham", "St V Kew"];
const CATEGORIES = ['Shelf', 'In Set'];

// Derive unique families and REF index
const FAMILIES = ['All', ...[...new Set(ITEMS.map(i => i.family).filter(Boolean))]];
const REF_INDEX = {};
ITEMS.forEach(item => { REF_INDEX[item.ref.toUpperCase()] = item; });

let currentLocation = HOSPITALS[0];
let currentCategory = 'Shelf';
let currentFamily   = 'All';
let currentPill     = 'All';
const quantities    = {};
const unexpectedByLoc = {}; // keyed by hospital
function getUnexpected() { return unexpectedByLoc[currentLocation] || []; }
function setUnexpected(items) { unexpectedByLoc[currentLocation] = items; }

// ── Helpers ───────────────────────────────────────────────────────────────────
function qKey(loc, cat, ref) { return [loc, cat, ref].join('|||'); }

function getExpected(item) {
  // Look up expected qty specifically for current hospital
  const hospEntry = ITEMS.find(i => i.ref === item.ref && i.hospital === currentLocation);
  if (!hospEntry) return 0;
  return currentCategory === 'In Set' ? hospEntry.kitExpected : hospEntry.shelfExpected;
}

function rowState(item, qty) {
  const q = parseInt(qty) || 0;
  if (q === 0) return '';
  const exp = getExpected(item);
  if (exp > 0) {
    if (q === exp) return 'match';
    if (q > exp)  return 'over';
    return 'under';
  }
  return 'counted';
}

let toastTimer;
function showToast(msg, ms=3500) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

// ── Location items filter ─────────────────────────────────────────────────────
function getLocationItems() {
  // Return all unique items (deduped by ref) so counters can count anything they find.
  // Expected qty will be 0/— for items not assigned to this hospital.
  const seen = new Set();
  return ITEMS.filter(i => {
    if (seen.has(i.ref)) return false;
    seen.add(i.ref);
    return true;
  });
}

function getFamilyItems() {
  const locItems = getLocationItems();
  if (currentFamily === 'All') return locItems;
  return locItems.filter(i => i.family === currentFamily);
}

function getFilteredItems() {
  const fam = getFamilyItems();
  const filtered = currentPill === 'All' ? fam : fam.filter(i => i.itemType === currentPill);
  // Sort: assigned to current hospital first, then alphabetical by name within each group
  return filtered.sort((a, b) => {
    const aAssigned = ITEMS.some(x => x.ref === a.ref && x.hospital === currentLocation) ? 0 : 1;
    const bAssigned = ITEMS.some(x => x.ref === b.ref && x.hospital === currentLocation) ? 0 : 1;
    if (aAssigned !== bAssigned) return aAssigned - bAssigned;
    return a.name.localeCompare(b.name);
  });
}

// ── Render locations ──────────────────────────────────────────────────────────
function renderLocations() {
  const el = document.getElementById('locations'); el.innerHTML = '';
  HOSPITALS.forEach(loc => {
    const btn = document.createElement('button');
    btn.className = 'loc-btn' + (loc === currentLocation ? ' active' : '');
    btn.textContent = loc;
    btn.onclick = () => {
      if (loc === currentLocation) return;
      const hasCounts = ITEMS.some(item =>
        CATEGORIES.some(cat => (quantities[qKey(currentLocation, cat, item.ref)] || 0) > 0)
      ) || getUnexpected().length > 0;
      if (hasCounts) {
        showHospitalWarning(currentLocation, loc);
      } else {
        switchHospital(loc);
      }
    };
    el.appendChild(btn);
  });
  setTimeout(() => {
    const active = document.querySelector('.loc-btn.active');
    if (active) { try { active.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' }); } catch(e) {} }
  }, 50);
}

// ── Category tabs ─────────────────────────────────────────────────────────────
function renderCategoryTabs() {
  const el = document.getElementById('cat-tabs'); el.innerHTML = '';
  [...CATEGORIES, 'Unexpected'].forEach(cat => {
    const tab = document.createElement('button');
    const isUnexp = cat === 'Unexpected';
    tab.className = 'cat-tab' + (isUnexp ? ' unexp' : '') + (cat === currentCategory ? ' active' : '');
    if (isUnexp) {
      tab.innerHTML = `Unexpected <span style="font-size:10px;opacity:.7">${getUnexpected().length}</span>`;
    } else {
      // Only count items assigned to this hospital
      const assignedItems = getLocationItems().filter(i => ITEMS.find(x => x.ref === i.ref && x.hospital === currentLocation));
      const done = assignedItems.filter(i => (quantities[qKey(currentLocation, cat, i.ref)] || 0) > 0).length;
      const label = cat === 'Shelf' ? 'Shelf Stock' : cat;
      tab.innerHTML = `${label} <span style="font-size:10px;opacity:.7">${done}/${assignedItems.length}</span>`;
    }
    tab.onclick = () => {
      currentCategory = cat;
      renderCategoryTabs();
      const showFilters = !isUnexp;
      document.getElementById('families').style.display = showFilters ? '' : 'none';
      document.getElementById('pills').style.display    = showFilters ? '' : 'none';
      if (showFilters) { renderFamilies(); renderPills(); }
      renderItems();
    };
    el.appendChild(tab);
  });
  const isUnexp = currentCategory === 'Unexpected';
  document.getElementById('families').style.display = isUnexp ? 'none' : '';
  document.getElementById('pills').style.display    = isUnexp ? 'none' : '';
}

// ── Family carousel ───────────────────────────────────────────────────────────
function renderFamilies() {
  const el = document.getElementById('families'); el.innerHTML = '';
  const locItems = getLocationItems();
  const locFamilies = [...new Set(locItems.map(i => i.family).filter(Boolean))];
  // Only show All if there are multiple families
  if (locFamilies.length > 1) {
    const allBtn = document.createElement('button');
    allBtn.className = 'family-btn' + (currentFamily === 'All' ? ' active' : '');
    allBtn.textContent = 'All';
    allBtn.onclick = () => {
      currentFamily = 'All'; currentPill = 'All';
      renderFamilies(); renderPills(); renderItems();
    };
    el.appendChild(allBtn);
  } else if (locFamilies.length === 1) {
    currentFamily = locFamilies[0];
    currentPill = 'All';
  }
  locFamilies.forEach(fam => {
    const btn = document.createElement('button');
    const famAssigned = ITEMS.some(i => i.family === fam && i.hospital === currentLocation);
    btn.className = 'family-btn' + (fam === currentFamily ? ' active' : '') + (!famAssigned && fam !== currentFamily ? ' unassigned' : '');
    btn.textContent = fam;
    btn.onclick = () => {
      currentFamily = fam; currentPill = 'All';
      renderFamilies(); renderPills(); renderItems();
      setTimeout(() => {
        const a = document.querySelector('.family-btn.active');
        if (a) { try { a.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}); } catch(e) {} }
      }, 50);
    };
    el.appendChild(btn);
  });
}

// ── Pills ─────────────────────────────────────────────────────────────────────
function renderPills() {
  const el = document.getElementById('pills'); el.innerHTML = '';
  const famItems = getFamilyItems();
  const typeMap = {};
  famItems.forEach(item => {
    if (!typeMap[item.itemType]) typeMap[item.itemType] = [];
    typeMap[item.itemType].push(item);
  });
  if (!famItems.length) return;
  el.appendChild(makePill('All', famItems));

  // Sort pill types: assigned to current hospital first (A-Z), then unassigned (A-Z)
  const types = Object.entries(typeMap).filter(([, items]) => items.length > 0);
  types.sort(([typeA], [typeB]) => {
    const aAssigned = ITEMS.some(x => x.itemType === typeA && x.hospital === currentLocation) ? 0 : 1;
    const bAssigned = ITEMS.some(x => x.itemType === typeB && x.hospital === currentLocation) ? 0 : 1;
    if (aAssigned !== bAssigned) return aAssigned - bAssigned;
    return typeA.localeCompare(typeB);
  });
  types.forEach(([type, items]) => el.appendChild(makePill(type, items)));
}

function makePill(label, items) {
  const done = items.filter(i => (quantities[qKey(currentLocation, currentCategory, i.ref)] || 0) > 0).length;
  // Items assigned to current hospital
  const assignedItems = items.filter(i => ITEMS.find(x => x.ref === i.ref && x.hospital === currentLocation));
  const hasAssigned = assignedItems.length > 0;
  const pill = document.createElement('button');
  pill.className = 'pill' + (currentPill === label ? ' active' : '') + (!hasAssigned && currentPill !== label ? ' unassigned' : '');
  // Badge shows: counted / assigned (not total)
  const assignedCount = assignedItems.length;
  const doneAssigned  = assignedItems.filter(i => (quantities[qKey(currentLocation, currentCategory, i.ref)] || 0) > 0).length;
  const badgeText = assignedCount > 0 ? `${doneAssigned}/${assignedCount}` : '0';
  const badgeDone = assignedCount > 0 && doneAssigned === assignedCount;
  pill.innerHTML = `${label} <span class="pill-badge${badgeDone ? ' done' : ''}">${badgeText}</span>`;
  pill.onclick = () => {
    currentPill = label; renderPills(); renderItems();
    setTimeout(() => {
      const a = document.querySelector('.pill.active');
      if (a) { try { a.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}); } catch(e) { a.scrollIntoView(false); } }
    }, 50);
  };
  return pill;
}

// ── Items ─────────────────────────────────────────────────────────────────────
function renderItems() {
  const el = document.getElementById('items-list'); el.innerHTML = '';

  if (currentCategory === 'Unexpected') {
    renderUnexpected(el); updateProgress(); return;
  }

  const items = getFilteredItems();
  if (!items.length) { el.innerHTML = '<div class="no-results">No items for this location / filter.</div>'; updateProgress(); return; }

  items.forEach((item, idx) => {
    const key  = qKey(currentLocation, currentCategory, item.ref);
    const qty  = quantities[key] ?? '';
    const exp  = getExpected(item);
    const state = rowState(item, qty);

    const row = document.createElement('div');
    row.className = 'item-row' + (state ? ' '+state : '');
    row.id = 'row-'+key;
    row.innerHTML = `
      <div class="item-info">
        <div class="item-ref">${item.ref}</div>
        <div class="item-name">${item.name}</div>
      </div>
      <div class="exp-block${exp > 0 ? ' assigned' : ''}">
        <div class="exp-lbl">EXP</div>
        <div class="exp-val">${exp > 0 ? exp : '—'}</div>
      </div>
      <div class="qty-controls">
        <button class="qty-btn" data-key="${key}" data-idx="${idx}" data-delta="-1" onclick="adjustQtyBtn(this)">&#8722;</button>
        <input class="qty-field" id="qty-${key}" data-key="${key}" data-idx="${idx}" type="number" min="0" inputmode="numeric" pattern="[0-9]*" value="${qty}" placeholder="0" oninput="setQtyInput(this)">
        <button class="qty-btn" data-key="${key}" data-idx="${idx}" data-delta="1" onclick="adjustQtyBtn(this)">+</button>
      </div>`;
    el.appendChild(row);
  });
  updateProgress();
}

function setQtyInput(input) {
  const key  = input.dataset.key;
  const item = getFilteredItems()[parseInt(input.dataset.idx)];
  setQty(key, item, input.value);
}

function adjustQtyBtn(btn) {
  const key   = btn.dataset.key;
  const item  = getFilteredItems()[parseInt(btn.dataset.idx)];
  const delta = parseInt(btn.dataset.delta);
  const inp   = document.getElementById('qty-'+key);
  const newVal = Math.max(0, (parseInt(inp.value)||0) + delta);
  inp.value = newVal;
  setQty(key, item, newVal.toString());
}

function setQty(key, item, val) {
  const parsed = val === '' ? 0 : (parseInt(val)||0);
  quantities[key] = parsed;
  const row = document.getElementById('row-'+key);
  if (row) {
    const state = rowState(item, parsed);
    row.className = 'item-row' + (state ? ' '+state : '');
  }
  renderCategoryTabs(); renderPills(); updateProgress(); autoSave();
}

// ── Unexpected items ──────────────────────────────────────────────────────────
function renderUnexpected(el) {
  const form = document.createElement('div');
  form.className = 'unexp-form';
  form.innerHTML = `
    <div class="unexp-form-title">Add unexpected item</div>
    <input type="text" id="unexp-sku"  placeholder="SKU / item code" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
    <input type="text" id="unexp-name" placeholder="Product name" autocomplete="off">
    <div style="display:-webkit-flex;display:flex;gap:8px;-webkit-align-items:center;align-items:center">
      <input type="number" id="unexp-qty" placeholder="Qty" min="1" inputmode="numeric" pattern="[0-9]*" style="width:90px">
      <button class="btn-add-item" onclick="addUnexpectedItem()">+ Add to list</button>
    </div>`;
  el.appendChild(form);

  if (!getUnexpected().length) {
    const empty = document.createElement('div');
    empty.className = 'unexp-empty';
    empty.textContent = 'No unexpected items added yet.';
    el.appendChild(empty);
    return;
  }

  const list = document.createElement('div');

  getUnexpected().forEach(item => {
    const row = document.createElement('div');

    row.innerHTML = `
      <div style="-webkit-flex:1;flex:1;min-width:0">
        <div class="unexp-ref">${item.ref}</div>
        <div class="unexp-name">${item.name||'—'}</div>
      </div>
      <div class="unexp-qty-block">
        <div class="unexp-qty-lbl">QTY</div>
        <div class="unexp-qty-val">${item.qty}</div>
      </div>
      <button class="unexp-del" onclick="deleteUnexpectedItem('${item.id}')">&#215;</button>`;
    list.appendChild(row);
  });
  el.appendChild(list);

function addUnexpectedItem() {
  const ref  = (document.getElementById('unexp-sku').value||'').trim().toUpperCase();
  const name = (document.getElementById('unexp-name').value||'').trim();
  const qty  = parseInt(document.getElementById('unexp-qty').value)||0;
  if (!ref) { showToast('Please enter a SKU.'); return; }
  if (qty < 1) { showToast('Please enter a quantity.'); return; }
  const ul = getUnexpected(); ul.push({ id: Date.now().toString(), ref, name, qty }); unexpectedByLoc[currentLocation] = ul;
  document.getElementById('unexp-sku').value  = '';
  document.getElementById('unexp-name').value = '';
  document.getElementById('unexp-qty').value  = '';
  renderCategoryTabs(); renderItems(); autoSave();
  showToast('Added: '+ref);
}

function deleteUnexpectedItem(id) {
  unexpectedByLoc[currentLocation] = (unexpectedByLoc[currentLocation]||[]).filter(i => i.id !== id);
  renderCategoryTabs(); renderItems(); autoSave();
}

// ── Progress ──────────────────────────────────────────────────────────────────
function updateProgress() {
  const locItems = getLocationItems(); // deduplicated
  let total = 0, done = 0;
  // Only count current tab
  locItems.forEach(item => {
    if (currentCategory === 'Unexpected') return;
    total++;
    if ((quantities[qKey(currentLocation, currentCategory, item.ref)]||0) > 0) done++;
  });
  // Include unexpected items in progress
  const unexpCount = getUnexpected().length;
  total += unexpCount; done += unexpCount;
  const pct = total > 0 ? done/total*100 : 0;
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('progress-text').textContent = `${done} of ${total} counts entered (${Math.round(pct)}%)`;
}

// ── Save / Restore ────────────────────────────────────────────────────────────
let autoSaveTimer;
function autoSave() { clearTimeout(autoSaveTimer); autoSaveTimer = setTimeout(() => saveProgress(true), 800); }

function saveProgress(auto=false) {
  const state = {
    name: document.getElementById('inp-name').value,
    date: document.getElementById('inp-date').value,
    location: currentLocation, category: currentCategory,
    family: currentFamily, pill: currentPill,
    quantities, unexpectedByLoc, timestamp: new Date().toISOString()
  };
  localStorage.setItem('stocktake_v4', JSON.stringify(state));
  document.getElementById('autosave-label').textContent = (auto?'Auto-saved':'Saved')+' at '+new Date().toLocaleTimeString();
}

function restoreProgress() {
  try {
    const saved = localStorage.getItem('stocktake_v4'); if (!saved) return;
    const s = JSON.parse(saved);
    if (s.name) document.getElementById('inp-name').value = s.name;
    if (s.date) document.getElementById('inp-date').value = s.date;
    Object.assign(quantities, s.quantities||{});
    if (s.unexpectedByLoc) Object.assign(unexpectedByLoc, s.unexpectedByLoc);
    if (s.location && HOSPITALS.includes(s.location)) currentLocation = s.location;
    if (s.category) currentCategory = s.category;
    if (s.family)   currentFamily   = s.family;
    if (s.pill)     currentPill     = s.pill;
    renderLocations(); renderCategoryTabs();
    if (currentCategory === 'Unexpected') {
      document.getElementById('families').style.display = 'none';
      document.getElementById('pills').style.display = 'none';
    } else {
      renderFamilies(); renderPills();
    }
    renderItems();
    document.getElementById('autosave-label').textContent = 'Restored from '+new Date(s.timestamp).toLocaleTimeString();
  } catch(e) {}
}

// ── Reset ─────────────────────────────────────────────────────────────────────
function resetCounts() {
  if (!confirm('Reset ALL counts to 0? This cannot be undone.')) return;
  unexpectedByLoc[currentLocation] = [];
  // Only reset current hospital — counters do one hospital at a time
  ITEMS.forEach(item => {
    CATEGORIES.forEach(cat => {
      quantities[qKey(currentLocation, cat, item.ref)] = 0;
    });
  });
  renderCategoryTabs(); renderPills(); renderItems();
  saveProgress(true); showToast('All counts reset to 0.');
}

// ── Export ────────────────────────────────────────────────────────────────────
function buildWorkbook() {
  const name = document.getElementById('inp-name').value || 'Unknown';
  const date = document.getElementById('inp-date').value;
  const rows = [];

  // Header block
  rows.push(['Stock Take Report']);
  rows.push(['Hospital:', currentLocation]);
  rows.push(['Counter:', name]);
  rows.push(['Date:', date]);
  rows.push([]);
  // Column headers
  rows.push(['SKU','Product Name','Screw Family','Item Type','Type','Expected Qty','Count','Variance','Status']);
  let counted = 0, total = 0;

  CATEGORIES.forEach(cat => {
    const locItems = ITEMS.filter(i => i.hospital === currentLocation);
    locItems.forEach(item => {
      total++;
      const key = qKey(currentLocation, cat, item.ref);
      const qty = quantities[key]||0;
      const exp = cat === 'In Set' ? item.kitExpected : item.shelfExpected;
      if (qty > 0) counted++;
      const variance = exp > 0 ? qty - exp : '';
      const status = qty===0 ? 'Not counted'
                   : exp===0 ? 'Counted'
                   : qty===exp ? 'Match'
                   : qty>exp  ? 'Over' : 'Under';
      rows.push([item.ref, item.name, item.family, item.itemType, cat==='In Set'?'In Set':'Shelf Stock', exp||'', qty||'', variance, status]);
    });
  });

  // Unexpected items
  getUnexpected().forEach(item => {
    total++; counted++;
    rows.push([item.ref, item.name||'—', '—', '—', 'Unexpected', '', item.qty, '', 'Unexpected']);
  });

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:12},{wch:48},{wch:18},{wch:18},{wch:14},{wch:13},{wch:8},{wch:10},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Stock Take');
  return { wb, name, date, counted, total };
}

function downloadExcel() {
  const { wb, date } = buildWorkbook();
  const filename = 'stock-take-' + date + '.xlsx';
  try {
    XLSX.writeFile(wb, filename);
    showToast('Excel downloaded!');
  } catch(e) {
    // Fallback for browsers that block XLSX.writeFile
    try {
      const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
      const blob  = new Blob([wbout], { type: 'application/octet-stream' });
      const url   = URL.createObjectURL(blob);
      const a     = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
      showToast('Excel downloaded!');
    } catch(e2) {
      showToast('Download failed — try a different browser.');
    }
  }
}

function exportAndEmail() {
  const { wb, name, date, counted, total } = buildWorkbook();
  const filename = 'stock-take-' + date + '.xlsx';

  // 1. Download the file first — use blob fallback for Samsung Internet
  try {
    XLSX.writeFile(wb, filename);
  } catch(e) {
    try {
      const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
      const blob  = new Blob([wbout], { type: 'application/octet-stream' });
      const url   = URL.createObjectURL(blob);
      const a     = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
    } catch(e2) { showToast('Download failed — try a different browser.'); return; }
  }

  // 2. Build mailto — use hyphen instead of em dash for max Outlook compatibility
  const subject = encodeURIComponent('Stock Take - ' + date + (name ? ' - ' + name : ''));
  const body    = encodeURIComponent(
    'Hi,' +
    '\n\nPlease find the stock take attached.' +
    '\n\nLocation: ' + currentLocation +
    '\nCounter: '  + (name || 'Unknown') +
    '\nDate: '     + date +
    '\nCounts entered: ' + counted + ' of ' + total +
    '\nFile: '     + filename +
    '\n\nIMPORTANT: Please attach the downloaded file before sending.' +
    '\n\nNote: If your email app did not open automatically, please open it manually and attach the file.'
  );

  // 3. Use invisible <a> tag click — works on Samsung Internet, iOS Safari, Chrome
  // window.location.href is blocked by Samsung Internet security policy
  showToast('Step 1: File downloaded\nStep 2: Attach it to the email that opens', 7000);

  setTimeout(() => {
    try {
      const a = document.createElement('a');
      a.href = 'mailto:?subject=' + subject + '&body=' + body;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => document.body.removeChild(a), 500);
    } catch(e) {
      // Fallback — direct assignment
      window.location.href = 'mailto:?subject=' + subject + '&body=' + body;
    }
  }, 1200);
}

// ── FAB & Init ────────────────────────────────────────────────────────────────
function scrollToTop() {
  const el = document.querySelector('.scroll-area');
  try { el.scrollTo({top:0,behavior:'smooth'}); } catch(e) { el.scrollTop=0; }
}

// ── Hospital switch modal ─────────────────────────────────────────────────────
let pendingSwitchLocation = null;

function showHospitalWarning(fromLoc, toLoc) {
  pendingSwitchLocation = toLoc;
  document.getElementById('modal-title').textContent = `Switch to ${toLoc}?`;
  document.getElementById('modal-body').innerHTML =
    `<strong>${fromLoc}</strong> is currently being counted.<br><br>Switching will reset all counts for ${fromLoc}. Are you sure?`;
  document.getElementById('hosp-modal').classList.remove('hidden');
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('hosp-modal')) dismissModal();
}

function dismissModal() {
  document.getElementById('hosp-modal').classList.add('hidden');
  pendingSwitchLocation = null;
}

function confirmSwitch() {
  document.getElementById('hosp-modal').classList.add('hidden');
  if (!pendingSwitchLocation) return;
  // Reset current hospital counts
  ITEMS.forEach(item => {
    CATEGORIES.forEach(cat => {
      quantities[qKey(currentLocation, cat, item.ref)] = 0;
    });
  });
  unexpectedByLoc[currentLocation] = [];
  switchHospital(pendingSwitchLocation);
  pendingSwitchLocation = null;
  showToast('Counts reset. Now counting ' + currentLocation + '.');
}

function switchHospital(loc) {
  currentLocation = loc; currentFamily = 'All'; currentPill = 'All';
  renderLocations(); renderCategoryTabs();
  if (currentCategory === 'Unexpected') {
    document.getElementById('families').style.display = 'none';
    document.getElementById('pills').style.display = 'none';
  } else {
    renderFamilies(); renderPills();
  }
  renderItems(); autoSave();
}


function scrollCarousel(id, dir) {
  const el = document.getElementById(id);
  try { el.scrollBy({ left: dir * 160, behavior: 'smooth' }); } catch(e) { el.scrollLeft += dir * 160; }
}

function init() {
  document.getElementById('inp-date').value = new Date().toISOString().split('T')[0];
  renderLocations(); renderCategoryTabs(); renderFamilies(); renderPills(); renderItems();
  restoreProgress();
  document.querySelector('.scroll-area').addEventListener('scroll', function() {
    document.getElementById('fab-top').classList.toggle('visible', this.scrollTop > 120);
  });
}

init();
</script>
